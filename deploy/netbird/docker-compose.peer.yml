name: goreecloud-netbird-peer
services:
  netbird-client:
    image: netbirdio/netbird@sha256:a2f6a659b281d4d6e9820ed07b6822fddfc992f31a6a01e7b1e65c5ad0fa3072
    container_name: goreecloud-netbird-client
    hostname: goreecloud-vps-mesh
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      NB_MANAGEMENT_URL: https://netbird.goreecloud.com
      NB_ADMIN_URL: https://netbird.goreecloud.com
      NB_SETUP_KEY_FILE: /run/secrets/netbird-setup-key
      NB_DISABLE_SERVER_ROUTES: "true"
    volumes:
      - ./client-state:/var/lib/netbird
      - ./client-setup.key:/run/secrets/netbird-setup-key:ro
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
