name: Fork-to-Native foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-and-license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify provenance, notices and workflow isolation
        run: bash scripts/check-ftn-baseline.sh

