name: Fork-to-Native foundation checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-and-license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify provenance, notices and workflow isolation
        run: bash scripts/check-ftn-baseline.sh
  focused-go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Validate portable Go primitives and IP prefix encoding
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 ./base62 ./monotime ./shared/netiputil
  acl-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Validate network ACL CIDR policy semantics
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/internal/acl
          go vet -p 2 ./client/internal/acl
  signal-relay-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Compile inherited signal and relay entrypoints without deploying
        env:
          GOTOOLCHAIN: local
        run: go build -p 2 -buildvcs=false ./signal ./relay

  metrics-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify telemetry requires explicit configuration
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/internal/metrics ./client/internal/metrics/remoteconfig
          go vet -p 2 ./client/internal/metrics ./client/internal/metrics/remoteconfig
  proxy-management-default-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Reject implicit hosted management endpoints in VPN proxy
        env:
          GOTOOLCHAIN: local
        run: go test -p 2 -count=1 ./proxy/cmd/proxy/cmd
  migration-preflight-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate read-only NetBird migration inventory
        run: |
          bash -n scripts/preflight-netbird-migration.sh
          python3 scripts/test-preflight-netbird-migration.py
  remaining-go-entrypoints-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Compile client, management and combined entrypoints (no services started)
        env:
          GOTOOLCHAIN: local
        run: go build -p 2 -buildvcs=false ./client ./management ./combined
  debug-upload-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified tag)
        with:
          node-version: '24'
      - name: Verify desktop debug uploads require consent and safe configuration
        run: node --test client/ui/frontend/src/lib/debugUploadUrl.test.mjs
  remote-debug-upload-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify remote diagnostic jobs reject inherited upload destinations
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/jobexec
          go vet -p 2 ./client/jobexec
  official-release-origin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify releases never point to inherited NetBird packages
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./version
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./version
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./version
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./version
  legacy-cloud-profile-migration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify legacy cloud migration never probes or mutates profiles without explicit opt-in
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/internal/profilemanager
          go vet -p 2 ./client/internal/profilemanager
  desktop-self-hosted-default-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Guard fresh desktop setup against implicit hosted management
        run: node --test client/ui/frontend/src/lib/managementOnboardingDefault.test.mjs
  inmemory-management-enrollment-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify explicit management before in-memory peer enrollment
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/internal/profilemanager ./client/embed
          go vet -p 2 ./client/internal/profilemanager ./client/embed
  cli-debug-upload-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Require explicit trusted URL before any CLI diagnostic upload
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/cmd
          go vet -p 2 ./client/cmd
  daemon-upload-privilege-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Reject unprivileged remote diagnostic uploads including inherited hosted service
        env:
          GOTOOLCHAIN: local
        run: |
          go test -p 2 -count=1 ./client/server
          go vet -p 2 ./client/server
  native-updater-lockout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Ensure legacy native installer entrypoints are fail-closed
        run: python3 scripts/check-ftn-native-updater-gate.py
      - name: Cross-compile Windows and macOS native updater tests
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          GOOS=windows GOARCH=amd64 go test -c ./client/internal/updater/installer -o /tmp/goreecloud-windows-updater.test.exe
          GOOS=darwin GOARCH=arm64 go test -c ./client/internal/updater/installer -o /tmp/goreecloud-macos-updater.test
