name: GoreeCloud VPN Android Compose compile
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/vpn-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/vpn-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-compose-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.0'
      - name: Provision Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"
      - name: Validate imported WireGuard routing policy with JVM unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --max-workers=2 --console=plain
      - name: Compile Android control plane and WireGuard GoBackend
        run: gradle -p android :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goreecloud-vpn-debug-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
      - name: Verify debug APK exists and is not production signed
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
          echo "Android source compiled only: no real device, VPN-consent verification, production signing or tunnel handshake acceptance"
