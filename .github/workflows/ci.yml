name: VPN foundation verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate manual WireGuard lab script syntax only
        run: bash -n tests/integration/wireguard_rootless_smoke.sh
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel metadata and license
        run: python scripts/verify_wheel.py dist
