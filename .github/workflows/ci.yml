name: VPN foundation verification
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Python test suite
        run: |
          PYTHONPATH=backend python -m unittest discover -s backend/tests -v
          PYTHONPATH=backend python -m compileall -q backend/goreevpn
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund
      - run: cd web && npm run typecheck && npm run build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "9.8.0"
      - run: cd android && gradle :app:assembleDebug --no-daemon --console=plain
  linux-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate native client source, Qt version and no arbitrary config paths
        run: |
          grep -q 'find_package(Qt6 6.12 REQUIRED' linux/CMakeLists.txt
          grep -q '/etc/wireguard/gcvpn.conf' linux/src/TunnelController.cpp
          grep -q 'pkexec' linux/src/TunnelController.cpp
          grep -q 'QtQuick' linux/qml/Main.qml
          echo "Source structure checked; native Qt 6.12 compilation remains a separate release gate"
