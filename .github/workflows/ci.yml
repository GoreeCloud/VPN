name: VPN foundation verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, verified upstream tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.6.0, verified upstream tag
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --no-deps -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Validate manual WireGuard lab script syntax only
        run: bash -n tests/integration/wireguard_rootless_smoke.sh
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify every wheel RECORD hash, license, path and package metadata
        run: python scripts/verify_wheel.py dist
