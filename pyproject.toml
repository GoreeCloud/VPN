[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-vpn"
version = "0.1.0a1"
description = "Privacy-first GoreeCloud VPN management foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
goreecloud-vpn = "goreecloud_vpn.server:main"
goreecloud-vpnctl = "goreecloud_vpn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
