[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-vpn"
version = "0.1.0a2"
description = "Privacy-first GoreeCloud VPN management foundation"
requires-python = ">=3.11"
dependencies = ["cryptography>=46.0.3,<51"]

[project.scripts]
goreecloud-vpn = "goreecloud_vpn.server:main"

[tool.setuptools.packages.find]
where = ["src"]
