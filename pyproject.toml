[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goreecloud-vpn"
version = "0.1.0a1"
description = "Privacy-first GoreeCloud VPN management foundation"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# This reviewer-gated offline verifier must NOT become a management API dependency.
policy-signatures = ["cryptography>=50.0.2,<51"]

[project.scripts]
goreecloud-vpn = "goreecloud_vpn.server:main"
goreecloud-vpnctl = "goreecloud_vpn.cli:main"
goreecloud-vpn-lab = "goreecloud_vpn.lab_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
